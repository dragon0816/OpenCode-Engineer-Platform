<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title data-i18n="ui.oep-workbench"></title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar navigation" data-i18n-aria-label="ui.sidebar">
      <button id="toggle-sidebar" type="button" aria-controls="session-sidebar" aria-expanded="true" data-i18n="ui.navigation"></button>
      <div id="session-sidebar">
      <div class="sidebar-assistant">
        <span class="assistant-avatar" aria-hidden="true">O</span>
        <div><strong id="sidebar-assistant-name" data-i18n="ui.assistant"></strong><small id="sidebar-assistant-intro" data-i18n="ui.local-engineering-assistant"></small></div>
      </div>
      <details class="rail-section" id="rail-functions" open>
      <summary data-i18n="ui.main-features"></summary>
      <nav class="views" data-i18n-aria-label="ui.workbench">
        <button id="open-chat" type="button" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/></svg><span data-i18n="ui.chat"></span></button>
        <button id="open-knowledge" type="button" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg><span data-i18n="ui.knowledge-base"></span></button>
        <button id="open-jobs" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 4v4m8-4v4"/></svg><span data-i18n="ui.schedules-jobs"></span></button>
        <button id="open-review" type="button" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h12v16H6zm3 8 2 2 4-4"/></svg><span data-i18n="ui.review"></span></button>
        <button id="open-settings" type="button" aria-keyshortcuts="Control+,"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-6 2v4"/></svg><span data-i18n="ui.settings"></span></button>
      </nav>
      </details>
      <details class="rail-section" id="rail-sessions" open>
      <summary><span data-i18n="ui.session"></span> <span class="rail-count" id="session-count" data-i18n-title="agents.session-count">0</span></summary>
      <div class="session-search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>
        <input id="session-search" type="search" autocomplete="off" data-i18n-placeholder="ui.search-sessions" data-i18n-aria-label="ui.search-sessions">
        <button id="clear-session-search" type="button" data-i18n-aria-label="ui.clear-search" hidden>×</button>
      </div>
      <nav id="sessions" data-i18n-aria-label="agents.sessions"></nav>
      </details>
      <details class="rail-section" id="rail-assistants" open>
        <summary><span data-i18n="ui.assistant"></span> <span class="rail-count" id="assistant-count"></span></summary>
        <button id="new-agent" type="button" disabled data-i18n-aria-label="agents.create" data-i18n-title="agents.create">+</button>
        <div id="agent-list"></div>
        <details id="archived-agents" hidden>
          <summary data-i18n="agents.status-disabled"></summary>
          <div id="archived-agent-list"></div>
        </details>
        <label for="agent" data-i18n="agents.main-mode"></label>
        <select id="agent" disabled>
          <option value="inspector" data-i18n="ui.data-analysis"></option>
          <option value="workbook" data-i18n="ui.excel-worksheets"></option>
        </select>
      </details>
      </div>
    </aside>
    <main id="work-area">
    <header class="top">
      <div class="top-model">
        <strong id="model" data-i18n="ui.loading-model"></strong>
        <span id="model-source" data-i18n="ui.external-model-service"></span>
        <p id="progress" role="status"></p>
      </div>
      <div class="top-actions">
        <div class="top-identity"><strong id="top-agent" data-i18n="agents.main"></strong><span data-i18n="ui.oep-local-user"></span><span id="connection" role="status" data-i18n="ui.connecting"></span></div>
        <details id="top-menu">
          <summary id="top-menu-trigger" class="menu-trigger" data-i18n-aria-label="ui.more-workbench-options" data-i18n-title="ui.more">⋯</summary>
          <div class="menu-actions">
            <div class="panel-openers" data-i18n-aria-label="ui.details-tabs" role="group">
              <button type="button" id="toggle-files" aria-controls="chat-files" aria-expanded="false" data-i18n="ui.files"></button>
              <button type="button" id="open-work" aria-controls="chat-files" data-i18n="ui.work"></button>
              <button type="button" id="open-diff" aria-controls="chat-files" data-i18n="ui.change-comparison"></button>
              <button type="button" id="open-notes" aria-controls="chat-files" data-i18n="ui.notes"></button>
            </div>
            <label class="locale-picker" for="menu-locale">
              <span data-i18n="ui.language"></span>
              <select id="menu-locale">
                <option value="zh-TW" data-i18n="ui.traditional-chinese"></option>
                <option value="en" data-i18n="ui.english"></option>
              </select>
            </label>
            <button id="stop" class="button-danger" type="button" disabled data-i18n="ui.stop-service"></button>
          </div>
        </details>
      </div>
    </header>
    <section id="agent-view" aria-labelledby="agent-title" hidden>
      <header class="page-header">
        <h1 id="agent-title" tabindex="-1" data-i18n="agents.details"></h1>
        <button id="close-agent" type="button" data-i18n="agents.back"></button>
      </header>
      <div class="agent-content">
        <nav id="agent-tabs" data-i18n-aria-label="agents.details"></nav>
        <form id="assistant-settings">
          <div id="agent-fields"></div>
          <div id="agent-actions" class="settings-actions"></div>
          <p id="settings-status" role="status"></p>
        </form>
      </div>
    </section>
    <section id="settings-view" aria-labelledby="settings-title" hidden>
      <header class="settings-heading page-header">
        <h1 id="settings-title" tabindex="-1" data-i18n="ui.settings"></h1>
        <button id="close-settings" type="button" data-i18n="ui.back-to-chat"></button>
      </header>
      <div class="settings-layout">
        <label id="settings-picker">
          <span data-i18n="ui.settings-categories"></span>
          <select id="settings-section"></select>
        </label>
        <nav id="settings-nav" data-i18n-aria-label="ui.settings-categories">
          <button type="button" data-section="assistant" aria-controls="settings-assistant" aria-current="page" data-i18n="ui.assistant"></button>
          <button type="button" data-section="channels" aria-controls="settings-channels" data-i18n="channels.title"></button>
          <button type="button" data-section="appearance" aria-controls="settings-appearance" data-i18n="ui.appearance"></button>
          <button type="button" data-section="model" aria-controls="settings-model" data-i18n="ui.model"></button>
          <button type="button" data-section="limits" aria-controls="settings-limits" data-i18n="ui.turn-limits"></button>
          <button type="button" data-section="projects" aria-controls="settings-projects" data-i18n="ui.projects-folders"></button>
          <button type="button" data-section="integrations" aria-controls="settings-integrations" data-i18n="ui.integrations"></button>
          <button type="button" data-section="input" aria-controls="settings-input" data-i18n="ui.input"></button>
          <button type="button" data-section="mcp" aria-controls="settings-mcp" data-i18n="ui.external-tools"></button>
          <button type="button" data-section="runtime" aria-controls="settings-runtime" data-i18n="ui.runtime"></button>
          <button type="button" data-section="about" aria-controls="settings-about" data-i18n="ui.about"></button>
        </nav>
        <div class="settings-content">
          <section id="settings-assistant" aria-labelledby="settings-assistant-title">
            <h2 id="settings-assistant-title" data-i18n="ui.assistant"></h2>
            <p class="settings-help" data-i18n="agents.settings-link-help"></p>
            <button id="open-main-agent" type="button" data-i18n="agents.open-main"></button>
          </section>
          <section id="settings-channels" aria-labelledby="settings-channels-title" hidden>
            <h2 id="settings-channels-title" data-i18n="channels.title"></h2>
            <p class="settings-help" data-i18n="channels.assignment-help"></p>
            <button id="channel-refresh" type="button" data-i18n="channels.refresh"></button>
            <div class="channel-table-scroll" role="region" tabindex="0" data-i18n-aria-label="channels.table">
              <table class="channel-table">
                <thead><tr>
                  <th scope="col" data-i18n="channels.bot"></th>
                  <th scope="col" data-i18n="channels.agent"></th>
                  <th scope="col" data-i18n="agents.replyLocale"></th>
                  <th scope="col" data-i18n="channels.poll-status"></th>
                  <th scope="col" data-i18n="channels.actions"></th>
                </tr></thead>
                <tbody id="channel-accounts"></tbody>
              </table>
            </div>
            <form id="channel-new" class="settings-group">
              <h3 data-i18n="channels.add"></h3>
              <p data-i18n="channels.secure-help"></p>
              <label for="channel-reference" data-i18n="channels.reference"></label>
              <input id="channel-reference" required autocomplete="off" spellcheck="false">
              <label for="channel-agent" data-i18n="channels.agent"></label>
              <select id="channel-agent" required></select>
              <div class="settings-actions">
                <button id="channel-verify" type="button" data-i18n="channels.verify"></button>
                <button id="channel-bind" type="submit" disabled data-i18n="channels.bind"></button>
                <p id="channel-status" role="status"></p>
              </div>
            </form>
          </section>
          <section id="settings-appearance" aria-labelledby="settings-appearance-title" hidden>
            <h2 id="settings-appearance-title" data-i18n="ui.appearance"></h2>
            <p class="settings-help" data-i18n="ui.change-the-theme-spacing-and-assistant-avatar"></p>
            <label class="locale-picker" for="settings-locale">
              <span data-i18n="ui.language"></span>
              <select id="settings-locale">
                <option value="zh-TW" data-i18n="ui.traditional-chinese"></option>
                <option value="en" data-i18n="ui.english"></option>
              </select>
            </label>
            <form id="appearance-settings">
              <label for="theme" data-i18n="ui.theme"></label>
              <select id="theme">
                <option value="system" data-i18n="ui.follow-system"></option>
                <option value="light" data-i18n="ui.light"></option>
                <option value="dark" data-i18n="ui.dark"></option>
              </select>
              <label for="density" data-i18n="ui.display-density"></label>
              <select id="density"><option value="comfortable" data-i18n="ui.comfortable"></option><option value="compact" data-i18n="ui.compact"></option></select>
              <div class="settings-actions">
                <button id="save-appearance" type="submit" disabled data-i18n="ui.save-appearance"></button>
                <p id="appearance-status" role="status"></p>
              </div>
            </form>
          </section>
          <section id="settings-model" aria-labelledby="settings-model-title" hidden>
            <h2 id="settings-model-title" data-i18n="ui.model"></h2>
            <p id="model-unsaved" role="status"></p>
            <p class="settings-help" data-i18n="ui.choose-the-default-model-for-new-sessions"></p>
            <p id="model-credentials"></p>
            <form id="model-settings">
              <div class="settings-actions">
                <button id="refresh-models" type="button" disabled data-i18n="model.refresh"></button>
                <button id="recheck-model" type="button" disabled data-i18n="ui.recheck-now"></button>
                <small id="model-discovery"></small>
              </div>
              <label for="default-alias" data-i18n="ui.default-model-for-new-sessions"></label>
              <select id="default-alias" disabled></select>
              <fieldset class="model-choices">
                <legend data-i18n="model.menu-models"></legend>
                <small id="model-limit"></small>
                <ul id="model-health"></ul>
              </fieldset>
              <div class="settings-actions model-save-actions">
                <button id="save-model" type="submit" disabled data-i18n="model.save-and-apply"></button>
                <p id="model-settings-status" role="status"></p>
              </div>
            </form>
            <div id="model-restart-bar" class="mcp-restart" hidden>
              <p data-i18n="model.restart-required"></p>
              <button id="model-restart" type="button" data-i18n="model.apply-now"></button>
            </div>
            <details class="settings-advanced">
              <summary data-i18n="ui.advanced"></summary>
              <p data-i18n="ui.external-operators-manage-the-model-gateway-and"></p>
            </details>
          </section>
          <section id="settings-limits" aria-labelledby="settings-limits-title" hidden>
            <h2 id="settings-limits-title" data-i18n="ui.turn-limits"></h2>
            <p class="settings-help" data-i18n="ui.set-how-much-history-how-many-tool"></p>
            <form id="limits-settings">
              <div id="limit-fields"></div>
              <div class="settings-actions">
                <button id="save-limits" type="submit" disabled data-i18n="ui.save-turn-limits"></button>
                <p id="limits-status" role="status"></p>
              </div>
            </form>
            <details class="settings-advanced">
              <summary data-i18n="ui.advanced"></summary>
              <p data-i18n="ui.when-history-reaches-its-limit-the-assistant"></p>
            </details>
          </section>
          <section id="settings-projects" aria-labelledby="settings-projects-title" hidden>
            <h2 id="settings-projects-title" data-i18n="ui.projects-folders"></h2>
            <p class="settings-help" data-i18n="ui.view-the-projects-working-folder-and-choose"></p>
            <label><span data-i18n="ui.project"></span> <select id="folder-project"></select></label>
            <p id="project-working-root"></p>
            <h3 data-i18n="ui.read-only-folders"></h3>
            <ul id="project-folder-list"></ul>
            <form id="project-folder-form">
              <label for="project-folder" data-i18n="ui.full-path-to-the-local-folder"></label>
              <input id="project-folder" type="text" required>
              <div class="settings-actions">
                <button type="submit" data-i18n="ui.add-read-only-folder"></button>
                <p id="project-folder-status" role="status"></p>
              </div>
            </form>
          </section>
          <section id="settings-integrations" aria-labelledby="settings-integrations-title" hidden>
            <h2 id="settings-integrations-title" data-i18n="ui.integrations"></h2>
            <p class="settings-help" data-i18n="ui.manage-knowledge-base-access-and-check-telegram"></p>
            <form id="knowledge-settings">
              <label><input id="knowledge-toolbox" type="checkbox" checked> <span data-i18n="ui.enable-knowledge-base-queries-in-new-sessions"></span></label>
              <label for="atlas-url" data-i18n="ui.atlas-url-optional"></label>
              <input id="atlas-url" type="url" maxlength="2048">
              <div class="settings-actions">
                <button type="submit" data-i18n="ui.save-knowledge-base-settings"></button>
                <button id="open-atlas" type="button" disabled data-i18n="ui.open-atlas"></button>
                <p id="knowledge-settings-status" role="status"></p>
              </div>
            </form>
            <dl>
              <dt data-i18n="ui.knowledge-base"></dt><dd id="knowledge-configured" data-i18n="ui.loading"></dd>
              <dt data-i18n="ui.telegram-assistant-bot"></dt><dd id="telegram-main-status" data-i18n="ui.loading"></dd>
              <dt data-i18n="ui.telegram-knowledge-base-bot"></dt><dd id="telegram-bi-status" data-i18n="ui.loading"></dd>
            </dl>
            <details class="settings-advanced">
              <summary data-i18n="ui.advanced"></summary>
              <h3 data-i18n="ui.integration-details"></h3>
              <p id="telegram-configured"></p>
              <ul>
                <li data-i18n="ui.company-sign-in-bridging-and-credential-trust"></li>
                <li data-i18n="ui.ssh-decisions-require-a-dedicated-aep-service"></li>
                <li data-i18n="ui.external-operators-start-and-restart-the-model"></li>
                <li data-i18n="ui.shared-databases-and-asset-subscriptions-require-company"></li>
              </ul>
            </details>
          </section>
          <section id="settings-input" aria-labelledby="settings-input-title" hidden>
            <h2 id="settings-input-title" data-i18n="ui.input"></h2>
            <p class="settings-help" data-i18n="ui.enable-dictation-to-enter-messages-with-your"></p>
            <label><input type="checkbox" id="enable-microphone"> <span data-i18n="ui.enable-microphone-input"></span></label>
            <p id="microphone-settings-status" role="status"></p>
          </section>
          <section id="settings-mcp" aria-labelledby="settings-mcp-title" hidden>
            <h2 id="settings-mcp-title" data-i18n="ui.external-tools"></h2>
            <p class="settings-help" data-i18n="ui.add-external-tools-and-choose-which-projects"></p>
            <div class="mcp-toolbar">
              <h3 data-i18n="ui.custom-servers"></h3>
              <button type="button" id="mcp-add" data-i18n="ui.add-server"></button>
            </div>
            <div class="mcp-restart" id="mcp-restart-bar" hidden>
              <p data-i18n="ui.settings-saved-restart-the-runtime-to-apply"></p>
              <button type="button" id="mcp-restart" data-i18n="ui.restart-runtime"></button>
            </div>
            <p id="mcp-status" role="status"></p>
            <div id="mcp-servers"></div>
            <div class="settings-group">
              <h3><span data-i18n="ui.built-in-knowledge-base"></span> <span class="runtime-badge" data-i18n="ui.managed-by-oep"></span></h3>
              <p id="mcp-knowledge-status" role="status"></p>
              <p id="mcp-knowledge-tools" hidden data-i18n="ui.built-in-tool-knowledge-base-query"></p>
              <p data-i18n="ui.settings-apply-to-new-sessions"></p>
              <div class="settings-actions">
                <button id="mcp-open-knowledge-settings" type="button" data-i18n="ui.manage-the-knowledge-base-query-tool"></button>
              </div>
            </div>
            <dialog id="mcp-editor" aria-labelledby="mcp-editor-title">
              <form id="mcp-form">
                <h3 id="mcp-editor-title"></h3>
                <label><span data-i18n="ui.name"></span> <input name="name" required maxlength="80" autofocus></label>
                <label><span data-i18n="ui.connection-method"></span>
                  <select name="transport"><option value="stdio" data-i18n="ui.local-program"></option><option value="remote" data-i18n="ui.remote-service"></option></select>
                </label>
                <div id="mcp-stdio-fields">
                  <label><span data-i18n="ui.executable"></span> <input name="executable" maxlength="2048"></label>
                  <label><span data-i18n="ui.arguments-one-per-line"></span> <textarea name="args" rows="3"></textarea></label>
                  <label><span data-i18n="ui.working-folder"></span> <input name="cwd" maxlength="2048"></label>
                </div>
                <div id="mcp-remote-fields" hidden>
                  <label><span data-i18n="ui.secure-connection-url"></span> <input name="url" type="url" maxlength="2048"></label>
                  <label><input name="localService" type="checkbox"> <span data-i18n="ui.allow-connections-to-local-or-private-network"></span></label>
                </div>
                <fieldset>
                  <legend id="mcp-credential-title" data-i18n="ui.program-credential-fields"></legend>
                  <p data-i18n="ui.values-are-stored-in-windows-user-credentials"></p>
                  <div id="mcp-credential-rows"></div>
                  <button type="button" id="mcp-add-credential" data-i18n="ui.add-credential-field"></button>
                </fieldset>
                <fieldset>
                  <legend data-i18n="ui.allowed-projects"></legend>
                  <div id="mcp-projects"></div>
                </fieldset>
                <label><span data-i18n="ui.data-scope"></span> <textarea name="dataScope" rows="2" maxlength="2000"></textarea></label>
                <details class="settings-advanced mcp-timeout-details">
                  <summary data-i18n="ui.advanced"></summary>
                  <p data-i18n="ui.external-tools-use-mcp-local-programs-connect"></p>
                  <p data-i18n="ui.timeouts-ms"></p>
                  <div class="mcp-timeouts">
                    <label><span data-i18n="ui.startup"></span> <input name="startup" type="number" min="100" max="120000" required></label>
                    <label><span data-i18n="ui.tool-list"></span> <input name="catalog" type="number" min="100" max="120000" required></label>
                    <label><span data-i18n="ui.execution"></span> <input name="execution" type="number" min="100" max="120000" required></label>
                  </div>
                  <p id="mcp-form-diagnostic" hidden></p>
                </details>
                <label><input name="enabled" type="checkbox"> <span data-i18n="ui.enable-server"></span></label>
                <p id="mcp-form-status" role="status"></p>
                <div class="settings-actions">
                  <button type="submit" data-i18n="ui.save"></button>
                  <button type="button" id="mcp-cancel" data-i18n="ui.cancel"></button>
                </div>
              </form>
            </dialog>
          </section>
          <section id="settings-runtime" aria-labelledby="settings-runtime-title" hidden>
            <h2 id="settings-runtime-title" data-i18n="ui.runtime"></h2>
            <p class="settings-help" data-i18n="ui.view-the-versions-used-by-local-services"></p>
            <p id="runtime-status" role="status" data-i18n="ui.loading-runtime"></p>
            <dl id="runtime-details"></dl>
            <p id="runtime-agent"></p>
            <details class="settings-advanced">
              <summary data-i18n="ui.advanced"></summary>
              <dl id="runtime-fingerprints"></dl>
            </details>
          </section>
          <section id="settings-about" aria-labelledby="settings-about-title" hidden>
            <h2 id="settings-about-title" data-i18n="ui.about"></h2>
            <p class="settings-help" data-i18n="ui.view-the-oep-version-data-location-license"></p>
            <dl id="about-details"></dl>
            <p id="about-status" role="status"></p>
          </section>
        </div>
      </div>
    </section>
    <section class="conversation" data-i18n-aria-label="ui.chat" id="chat-view">
      <header class="page-header">
        <h1 id="session-title" tabindex="-1" data-i18n="ui.chat"></h1>
      </header>
      <div id="error" role="alert" hidden></div>
      <div id="messages" class="messages" data-i18n-aria-label="ui.messages">
        <p class="empty" data-i18n="ui.select-or-create-a-session-to-start"></p>
      </div>
      <button id="jump-latest" type="button" hidden data-i18n="ui.jump-to-latest-message"></button>
      <section id="chat-resources" data-i18n-aria-label="ui.session-files" hidden></section>
      <dialog id="remove-session-card" aria-labelledby="remove-session-question">
        <form method="dialog">
          <h2 id="remove-session-question"></h2>
          <p data-i18n="ui.deleting-this-session-removes-it-from-the"></p>
          <button value="reject" autofocus data-i18n="ui.cancel"></button>
          <button value="accept" class="button-danger" data-i18n="ui.confirm-deletion"></button>
        </form>
      </dialog>
      <form id="composer">
        <div id="drop">
        <label for="prompt" data-i18n="ui.messages"></label>
        <details id="project-read" hidden>
          <summary data-i18n="ui.attach-a-file-from-a-read-only"></summary>
          <label><span data-i18n="ui.folder"></span> <select id="project-read-folder"></select></label>
